<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>New Tab</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    html {
      background-color: #0e1017;
      color-scheme: dark;
    }

    :root {
      --bg-base: #0e1017;
      --bg-surface: #151822;
      --bg-elevated: #1e2230;
      --border-subtle: #292e40;
      --border-focus: #3b82f6;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent-primary: #4e7cf6;
    }

    body.theme-midnight {
      --bg-base: #000000;
      --bg-surface: #09090b;
      --bg-elevated: #141417;
      --border-subtle: #27272a;
      --border-focus: #60a5fa;
      --text-main: #fafafa;
      --text-muted: #a1a1aa;
      --text-dim: #71717a;
    }

    body.theme-cyberpunk {
      --bg-base: #0d0221;
      --bg-surface: #140536;
      --bg-elevated: #240a5a;
      --border-subtle: #ff007f;
      --border-focus: #00f0ff;
      --text-main: #00f0ff;
      --text-muted: #ff007f;
      --text-dim: #a78bfa;
    }

    body.theme-nord {
      --bg-base: #242933;
      --bg-surface: #2e3440;
      --bg-elevated: #3b4252;
      --border-subtle: #434c5e;
      --border-focus: #88c0d0;
      --text-main: #eceff4;
      --text-muted: #d8dee9;
      --text-dim: #9aa5b8;
    }

    body.theme-light {
      --bg-base: #f8fafc;
      --bg-surface: #ffffff;
      --bg-elevated: #f1f5f9;
      --border-subtle: #e2e8f0;
      --border-focus: #3b82f6;
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-dim: #94a3b8;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Background Glow */
    .ambient-glow {
      position: absolute;
      top: 25%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 500px;
      height: 350px;
      background: radial-gradient(circle, var(--accent-primary) 0%, transparent 70%);
      opacity: 0.12;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }

    .newtab-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Hero Branding */
    .hero-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      cursor: default;
    }

    .brand-logo-glow {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--accent-primary) 0%, rgba(56, 189, 248, 0.6) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 10px 25px -5px var(--accent-primary);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .brand-logo-glow:hover {
      transform: scale(1.05) rotate(3deg);
      box-shadow: 0 14px 30px -4px var(--accent-primary);
    }

    .brand-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(135deg, var(--text-main) 30%, var(--accent-primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-tagline {
      font-size: 13.5px;
      color: var(--text-muted);
      letter-spacing: 0.3px;
    }

    /* Search Box */
    .search-card {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 6px 8px 6px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 24px -6px rgba(0, 0, 0, 0.3);
      transition: all 0.2s ease;
    }

    .search-card:focus-within {
      border-color: var(--accent-primary);
      box-shadow: 0 12px 32px -4px rgba(0, 0, 0, 0.45), 0 0 0 2px var(--accent-primary);
      transform: translateY(-2px);
    }

    .search-icon {
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 15px;
      color: var(--text-main);
      user-select: text;
    }

    .search-input::placeholder {
      color: var(--text-dim);
    }

    .search-submit-btn {
      background: var(--accent-primary);
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    .search-submit-btn:hover {
      opacity: 0.9;
      transform: scale(1.05);
    }

    .search-submit-btn:active {
      transform: scale(0.95);
    }

    /* Shortcuts Grid */
    .shortcuts-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .shortcut-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      text-decoration: none;
      color: var(--text-main);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .shortcut-card:hover {
      background: var(--bg-elevated);
      border-color: var(--border-focus);
      transform: translateY(-3px);
      box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.3);
    }

    .shortcut-icon-box {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-primary);
      transition: transform 0.2s ease;
    }

    .shortcut-card:hover .shortcut-icon-box {
      transform: scale(1.1);
    }

    .shortcut-title {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-main);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    /* Privacy Status Banner */
    .privacy-status-pill {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 8px 18px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      color: #34d399;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .privacy-status-pill:hover {
      background: rgba(16, 185, 129, 0.2);
      border-color: #10b981;
      transform: translateY(-1px);
    }

    .privacy-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    @media (max-width: 580px) {
      .shortcuts-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body class="theme-titan-dark">
  <div class="ambient-glow"></div>

  <div class="newtab-container">
    <!-- Hero Branding -->
    <div class="hero-brand">
      <div class="brand-logo-glow">
        <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
          <path d="M2 12h20"></path>
        </svg>
      </div>
      <div class="brand-title">TITAN</div>
      <div class="brand-tagline">Fast &bull; Private &bull; Zero-Telemetry Core</div>
    </div>

    <!-- Search Form -->
    <form class="search-card" id="searchForm">
      <div class="search-icon">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </div>
      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="Search the web or type a URL..."
        autocomplete="off"
      />
      <button type="submit" class="search-submit-btn" id="searchSubmitBtn" title="Search">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </form>

    <!-- Shortcuts Grid -->
    <div class="shortcuts-grid">
      <div class="shortcut-card" data-url="https://www.google.com">
        <div class="shortcut-icon-box" style="color: #4285f4;">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M12 8v8M8 12h8"></path>
          </svg>
        </div>
        <span class="shortcut-title">Google</span>
      </div>

      <div class="shortcut-card" data-url="https://www.youtube.com">
        <div class="shortcut-icon-box" style="color: #ef4444;">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
            <path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"></path>
            <polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon>
          </svg>
        </div>
        <span class="shortcut-title">YouTube</span>
      </div>

      <div class="shortcut-card" data-url="https://github.com">
        <div class="shortcut-icon-box" style="color: var(--text-main);">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
            <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
          </svg>
        </div>
        <span class="shortcut-title">GitHub</span>
      </div>

      <div class="shortcut-card" data-url="https://duckduckgo.com">
        <div class="shortcut-icon-box" style="color: #f97316;">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
        </div>
        <span class="shortcut-title">DuckDuckGo</span>
      </div>

      <div class="shortcut-card" data-url="https://reddit.com">
        <div class="shortcut-icon-box" style="color: #ff4500;">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
        </div>
        <span class="shortcut-title">Reddit</span>
      </div>

      <div class="shortcut-card" data-url="https://wikipedia.org">
        <div class="shortcut-icon-box" style="color: #06b6d4;">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
        </div>
        <span class="shortcut-title">Wikipedia</span>
      </div>

      <div class="shortcut-card" data-url="titan://privacy">
        <div class="shortcut-icon-box" style="color: #10b981;">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            <polyline points="9 12 11 14 15 10"></polyline>
          </svg>
        </div>
        <span class="shortcut-title">Privacy Shield</span>
      </div>

      <div class="shortcut-card" data-url="titan://settings">
        <div class="shortcut-icon-box" style="color: var(--accent-primary);">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </div>
        <span class="shortcut-title">Settings</span>
      </div>
    </div>

    <!-- Privacy Shield Status Pill -->
    <div class="privacy-status-pill" data-url="titan://privacy">
      <span class="privacy-dot"></span>
      <span>Zero-Telemetry Core Active &bull; All Data Strictly Local</span>
    </div>
  </div>

  <script src="newtab.js"></script>
</body>
</html>
