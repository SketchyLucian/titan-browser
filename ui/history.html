<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>History</title>
  <style>
    :root { color-scheme: dark; --bg: #0f1015; --surface: #171922; --border: #2a2d39; --text: #f1f5f9; --muted: #94a3b8; --accent: #4e7cf6; }
    body.theme-titan-light { color-scheme: light; --bg: #f5f7fb; --surface: #fff; --border: #d9deea; --text: #152033; --muted: #657086; }
    body.theme-midnight { --bg: #000; --surface: #0b0b0d; --border: #29292d; }
    body.theme-cyber-neon { --bg: #0d0b18; --surface: #17122a; --border: #3f2e69; --accent: #00e5ff; }
    body.theme-nordic { --bg: #0f171c; --surface: #172229; --border: #30434d; --accent: #88c0d0; }
    body.theme-amber { --bg: #141210; --surface: #201c18; --border: #44382d; --accent: #f5a524; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width: min(920px, calc(100% - 40px)); margin: 0 auto; padding: 42px 0 70px; }
    header { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
    h1 { flex: 1; margin: 0; font-size: 28px; }
    input { width: min(360px, 46vw); padding: 11px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); outline: none; }
    input:focus { border-color: var(--accent); }
    button { border: 1px solid var(--border); border-radius: 9px; padding: 10px 13px; background: var(--surface); color: var(--text); cursor: pointer; }
    button:hover { border-color: var(--accent); }
    #historyList { overflow: hidden; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); }
    .entry { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 18px; width: 100%; padding: 14px 18px; border: 0; border-bottom: 1px solid var(--border); border-radius: 0; text-align: left; }
    .entry:last-child { border-bottom: 0; }
    .time, .url, #empty { color: var(--muted); }
    .title, .url { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .title { font-weight: 600; margin-bottom: 3px; }
    #empty { padding: 64px 20px; text-align: center; }
    @media (max-width: 680px) { header { flex-wrap: wrap; } input { order: 3; width: 100%; } .entry { grid-template-columns: 1fr; gap: 4px; } }
  </style>
</head>
<body class="theme-titan-dark">
  <main>
    <header>
      <h1>History</h1>
      <input id="historySearch" type="search" placeholder="Search history" autofocus />
      <button id="clearHistory" type="button">Clear history</button>
    </header>
    <section id="historyList" aria-live="polite"></section>
  </main>
  <script src="history.js"></script>
</body>
</html>
