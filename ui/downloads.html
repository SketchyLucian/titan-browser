<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Downloads</title>
  <style>
    :root { color-scheme: dark; --bg: #0f1015; --surface: #171922; --border: #2a2d39; --text: #f1f5f9; --muted: #94a3b8; --accent: #4e7cf6; --danger: #ef6b73; }
    body.theme-titan-light { color-scheme: light; --bg: #f5f7fb; --surface: #fff; --border: #d9deea; --text: #152033; --muted: #657086; }
    body.theme-midnight { --bg: #000; --surface: #0b0b0d; --border: #29292d; }
    body.theme-cyber-neon { --bg: #0d0b18; --surface: #17122a; --border: #3f2e69; --accent: #00e5ff; }
    body.theme-nordic { --bg: #0f171c; --surface: #172229; --border: #30434d; --accent: #88c0d0; }
    body.theme-amber { --bg: #141210; --surface: #201c18; --border: #44382d; --accent: #f5a524; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width: min(920px, calc(100% - 40px)); margin: 0 auto; padding: 42px 0 70px; }
    header { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
    h1 { flex: 1; margin: 0; font-size: 28px; }
    button { border: 1px solid var(--border); border-radius: 9px; padding: 10px 13px; background: var(--surface); color: var(--text); cursor: pointer; }
    button:hover:not(:disabled) { border-color: var(--accent); }
    button:disabled { cursor: default; opacity: .55; }
    #downloadList { overflow: hidden; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); }
    .entry { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 20px; padding: 16px 18px; border-bottom: 1px solid var(--border); }
    .entry:last-child { border-bottom: 0; }
    .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .detail { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status-failed, .status-interrupted { color: var(--danger); }
    .status-complete { color: var(--accent); }
    #empty { padding: 64px 20px; text-align: center; color: var(--muted); }
  </style>
</head>
<body class="theme-titan-dark">
  <main>
    <header>
      <h1>Downloads</h1>
      <button id="clearDownloads" type="button">Clear list</button>
    </header>
    <section id="downloadList" aria-live="polite"></section>
  </main>
  <script src="downloads.js"></script>
</body>
</html>
