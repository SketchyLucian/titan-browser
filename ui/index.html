<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Titan Browser</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="theme-titan-dark">
  <div class="browser-chrome" id="browserChrome">
    <!-- Top Row: Tab Strip, Drag Region & Integrated Window Controls (38px) -->
    <div class="tab-strip" id="tabStrip">
      <div class="brand-logo" id="brandLogo" title="Titan Browser - Settings (titan://settings)">
        <svg class="icon-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
          <path d="M2 12h20"></path>
        </svg>
        <span class="brand-name">TITAN</span>
      </div>

      <div class="tabs-container" id="tabsContainer">
        <!-- Dynamic Tabs inserted here -->
      </div>

      <button class="icon-btn new-tab-btn" id="newTabBtn" title="New Tab (Ctrl+T)">
        <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2.5" fill="none">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>

      <!-- Draggable empty area -->
      <div class="window-drag-region" id="windowDragRegion"></div>

      <!-- Integrated Window Titlebar Controls -->
      <div class="window-controls">
        <button class="win-btn win-min" id="winMinBtn" title="Minimize">
          <svg viewBox="0 0 12 12" width="10" height="10" stroke="currentColor" stroke-width="1.5">
            <line x1="1" y1="6" x2="11" y2="6"></line>
          </svg>
        </button>
        <button class="win-btn win-max" id="winMaxBtn" title="Maximize / Restore">
          <svg id="winMaxIcon" viewBox="0 0 12 12" width="10" height="10" stroke="currentColor" stroke-width="1.5" fill="none">
            <rect x="1.5" y="1.5" width="9" height="9"></rect>
          </svg>
        </button>
        <button class="win-btn win-close" id="winCloseBtn" title="Close">
          <svg viewBox="0 0 12 12" width="10" height="10" stroke="currentColor" stroke-width="1.5">
            <line x1="1" y1="1" x2="11" y2="11"></line>
            <line x1="11" y1="1" x2="1" y2="11"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Middle Row: Navigation, Omnibar, and Tools (38px) -->
    <div class="nav-bar">
      <div class="nav-controls">
        <button class="nav-btn" id="backBtn" title="Click to go back (Alt+Left)" disabled>
          <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2.2" fill="none">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <button class="nav-btn" id="forwardBtn" title="Click to go forward (Alt+Right)" disabled>
          <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2.2" fill="none">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
        <button class="nav-btn" id="reloadBtn" title="Reload this page (Ctrl+R)">
          <svg id="reloadIcon" viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2.2" fill="none">
            <path d="M23 4v6h-6"></path>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
        </button>
        <button class="nav-btn" id="homeBtn" title="Open Home Page">
          <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
        </button>
      </div>

      <!-- Omnibar / Address & Search Input -->
      <div class="omnibar-container" id="omnibarContainer">
        <div class="ssl-indicator" id="sslBadge" title="Connection is secure">
          <svg id="sslIcon" viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2.2" fill="none">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>

        <form id="urlForm" class="url-form" autocomplete="off">
          <input
            type="text"
            id="urlInput"
            class="url-input"
            placeholder="Search or type a URL..."
            spellcheck="false"
          />
        </form>

        <button class="omnibar-btn" id="bookmarkToggleBtn" title="Bookmark this tab">
          <svg id="bookmarkStarIcon" viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
        </button>

        <div class="search-engine-badge" id="searchEngineBadge" title="Search Engine: Google">
          <span>Google</span>
        </div>
      </div>

      <!-- Quick Action Buttons & Settings -->
      <div class="action-controls">
        <button class="action-btn" id="zoomOutBtn" title="Zoom Out (90%)">-</button>
        <span class="zoom-level" id="zoomDisplay" title="Current Zoom">100%</span>
        <button class="action-btn" id="zoomInBtn" title="Zoom In (110%)">+</button>
        <div class="divider"></div>
        <button class="action-btn" id="historyBtn" title="History (Ctrl+H)">
          <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none">
            <path d="M3 12a9 9 0 1 0 3-6.7"></path>
            <polyline points="3 3 3 9 9 9"></polyline>
            <polyline points="12 7 12 12 16 14"></polyline>
          </svg>
        </button>
        <button class="action-btn" id="downloadsBtn" title="Downloads (Ctrl+J)">
          <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none">
            <path d="M12 3v12"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <path d="M5 21h14"></path>
          </svg>
        </button>
        <div class="toolbar-extensions-list" id="toolbarExtensionsList"></div>
        <button class="action-btn" id="extensionsBtn" title="Extensions & Add-ons">
          <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none">
            <path d="M20.5 11H19V7c0-1.1-.9-2-2-2h-4V3.5a2.5 2.5 0 0 0-5 0V5H4c-1.1 0-1.99.9-1.99 2v3.8H3.5c1.49 0 2.7 1.21 2.7 2.7s-1.21 2.7-2.7 2.7H2V20c0 1.1.9 2 2 2h3.8v-1.5c0-1.49 1.21-2.7 2.7-2.7 1.49 0 2.7 1.21 2.7 2.7V22H17c1.1 0 2-.9 2-2v-4h1.5a2.5 2.5 0 0 0 0-5z"></path>
          </svg>
        </button>
        <button class="action-btn" id="privateTabBtn" title="New Private Tab (Ctrl+Shift+N)">
          <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none">
            <rect x="5" y="10" width="14" height="11" rx="2"></rect>
            <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
          </svg>
        </button>
        <button class="action-btn settings-btn" id="settingsBtn" title="Browser Settings (titan://settings)">
          <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Extensions Popup Dropdown Menu -->
    <div class="extensions-dropdown" id="extensionsDropdown" style="display: none;">
      <div class="extensions-dropdown-header" id="extDropdownHeader">
        <div class="ext-dropdown-title-row">
          <span class="extensions-dropdown-title" id="extDropdownTitle">Extensions</span>
          <button class="ext-dropdown-close-btn" id="closeExtDropdownBtn" title="Close Popup">
            <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <button class="extensions-manage-btn" id="manageExtensionsBtn" title="Manage Extensions (titan://extensions)">Manage Extensions</button>
      </div>
      <div class="extensions-dropdown-body" id="extensionsDropdownBody">
        <div class="extensions-dropdown-list" id="extensionsDropdownList">
          <!-- Extensions list rendered dynamically -->
        </div>
        <div class="extension-detail-view" id="extensionDetailView" style="display: none;">
          <!-- Specific extension interactive popup UI -->
        </div>
      </div>
    </div>

    <!-- Optional Bottom Row: Bookmarks Toolbar (Collapsed when empty) -->
    <div class="bookmarks-bar" id="bookmarksBar">
      <div class="bookmarks-list" id="bookmarksList">
        <!-- Bookmarks dynamically rendered -->
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
