[package]
name = "titan-browser"
version = "0.4.3"
edition = "2021"
description = "A modern, high-performance web browser built in Rust with multi-tab support and full YouTube playback."
authors = ["Titan Browser Team"]

[dependencies]
tao = "0.36.0"
wry = "0.56.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
adblock = "0.13"
ureq = { version = "2", features = ["json"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
winres = "0.1.12"
