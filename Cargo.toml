[package]
name = "titan-browser"
version = "0.1.0"
edition = "2021"
description = "A modern, high-performance web browser built in Rust with multi-tab support and full YouTube playback."
authors = ["Titan Browser Team"]

[lib]
name = "titan_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }
